apiVersion: batch/v1
kind: Job
metadata:
  name: llm-systems-a40
spec:
  template:
    spec:
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       # - matchExpressions:
      #       #   - key: topology.kubernetes.io/region
      #       #     operator: In
      #       #     values:
      #       #     - us-west

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      # nodeSelector:
      #   nvidia.com/gpu.product: "NVIDIA-A10"
      
      containers:
        - name: finetune-gpu
          image: subhasis79/llm-cuda:1.1
          env:
            - name: 'model_name'
              value: "meta-llama/Llama-3.1-70B"
          command: ["/bin/sh", "-c"]
          args: [" cd /datavol/ ;
                   python train_qwen_lora.py;
                  sleep 180000;                      
             
          "]

          resources:
            limits:
              memory: 32Gi
              cpu: 4
              nvidia.com/a40: "1"
              

            requests:
              memory: 32Gi
              cpu: 4
              nvidia.com/a40: "1"
              

          volumeMounts:
             - mountPath: /datavol
               name: datavol
             
      volumes:
         - name: datavol
           persistentVolumeClaim:
             claimName:  adil-pvc
        
      restartPolicy: Never
  backoffLimit: 3