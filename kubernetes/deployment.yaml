apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finetune-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finetune
  template:
    metadata:
      labels:
        app: finetune
    spec:
      containers:
      - name: finetune
        image: your-registry/finetune:latest
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "32Gi"
            cpu: "8"
          requests:
            memory: "16Gi"
            cpu: "4"
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
        - name: training-data
          mountPath: /app/data
        envFrom:
        - configMapRef:
            name: env-config
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-storage-pvc
      - name: training-data
        persistentVolumeClaim:
          claimName: training-data-pvc
---
---