apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-finetune
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: mypod
        image: lishngq/custom-cuda:latest
        resources:
          limits:
            memory: 128Gi
            cpu: "8"
            nvidia.com/gpu: "2"
          requests:
            memory: 128Gi
            cpu: "8"
            nvidia.com/gpu: "2"
        volumeMounts:
          - mountPath: "/mnt/storage"
            name: storage-volume
          - mountPath: "/dev/shm"
            name: dshm
        command: [ "sh", "-c", "/usr/sbin/sshd && echo 'I'\\''m a new pod with GPUs and storage' && sleep infinity" ]
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: llama-finetune-pvc
        - name: dshm
          emptyDir:
            medium: Memory
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        nvidia.com/gpu.product: "NVIDIA-A100"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                - us-west